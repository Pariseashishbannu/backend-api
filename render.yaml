databases:
  - name: backenddb
    databaseName: backenddb
    user: backenduser
    plan: free # Zero cost database

services:
  - type: web
    name: backend-api
    runtime: docker
    rootDir: backend
    plan: free # Zero cost web service
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*" # Allow all hosts for initial setup, narrow down later
      - key: DATABASE_URL
        fromDatabase:
          name: backenddb
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
